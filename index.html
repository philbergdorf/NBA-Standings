<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025–26 NBA Standings Race</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0f1a;
            --bg-card: rgba(255,255,255,0.03);
            --bg-card-hover: rgba(255,255,255,0.07);
            --border-subtle: rgba(255,255,255,0.06);
            --text-primary: #f0f0f0;
            --text-secondary: #8a8fa8;
            --text-muted: #4a4f68;
            --accent-gold: #d4a843;
            --accent-blue: #3b82f6;
            --playoff-green: #22c55e;
            --playin-amber: #f59e0b;
            --eliminated-red: #ef4444;
            --row-height: 52px;
            --glow-gold: rgba(212,168,67,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Atmospheric background */
        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(59,130,246,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(212,168,67,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(15,20,35,1) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        .page-wrapper {
            position: relative;
            z-index: 1;
            max-width: 880px;
            margin: 0 auto;
            padding: 28px 24px 48px;
        }

        /* ── Header ── */
        .header {
            margin-bottom: 24px;
        }

        .header-top {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .title-group {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(28px, 5vw, 40px);
            letter-spacing: 2px;
            color: var(--text-primary);
            line-height: 1;
        }

        .league-badge {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        .date-display {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 26px;
            letter-spacing: 3px;
            color: var(--accent-gold);
            transition: opacity 0.2s;
        }

        /* ── Controls ── */
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .conf-tabs {
            display: flex;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 4px;
            gap: 2px;
        }

        .conf-tab {
            font-family: 'DM Sans', sans-serif;
            padding: 10px 22px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
        }

        .conf-tab.active {
            background: rgba(255,255,255,0.08);
            color: var(--text-primary);
            box-shadow: 0 1px 8px rgba(0,0,0,0.3);
        }

        .conf-tab:hover:not(.active) {
            color: var(--text-secondary);
        }

        .view-toggle {
            display: flex;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 4px;
            gap: 2px;
        }

        .view-btn {
            font-family: 'DM Sans', sans-serif;
            padding: 10px 18px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
        }

        .view-btn.active {
            background: rgba(255,255,255,0.08);
            color: var(--text-primary);
            box-shadow: 0 1px 8px rgba(0,0,0,0.3);
        }

        .view-btn:hover:not(.active) {
            color: var(--text-secondary);
        }

        .divider {
            width: 1px;
            height: 28px;
            background: var(--border-subtle);
        }

        .playback {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ctrl-btn {
            font-family: 'DM Sans', sans-serif;
            width: 38px; height: 38px;
            border: 1px solid var(--border-subtle);
            background: rgba(255,255,255,0.03);
            color: var(--text-secondary);
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            display: grid;
            place-items: center;
            transition: all 0.2s ease;
        }

        .ctrl-btn:hover {
            background: rgba(255,255,255,0.08);
            color: var(--text-primary);
            border-color: rgba(255,255,255,0.12);
        }

        .ctrl-btn.play-btn {
            width: 44px; height: 44px;
            background: var(--accent-gold);
            border-color: var(--accent-gold);
            color: var(--bg-primary);
            font-size: 16px;
            border-radius: 12px;
        }

        .ctrl-btn.play-btn:hover {
            background: #e0b44f;
            border-color: #e0b44f;
            color: var(--bg-primary);
            box-shadow: 0 4px 20px rgba(212,168,67,0.3);
        }

        .speed-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .speed-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .speed-slider {
            width: 70px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.1);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: var(--text-secondary);
            cursor: pointer;
            transition: background 0.2s;
        }

        .speed-slider::-webkit-slider-thumb:hover {
            background: var(--text-primary);
        }

        /* ── Standings Board ── */
        .board {
            position: relative;
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            overflow: hidden;
            margin-bottom: 24px;
        }

        .board-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px 12px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .board-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 16px;
            letter-spacing: 3px;
            color: var(--text-muted);
        }

        .board-legend {
            display: flex;
            gap: 16px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .legend-dot {
            width: 8px; height: 8px;
            border-radius: 2px;
        }

        .legend-dot.playoffs { background: var(--playoff-green); }
        .legend-dot.playin { background: var(--playin-amber); }
        .legend-dot.lottery { background: var(--eliminated-red); opacity: 0.6; }

        .standings-area {
            position: relative;
            padding: 8px 0;
            display: none;
        }

        .standings-area.active {
            display: block;
        }

        /* Cutlines between zones */
        .cutline {
            position: absolute;
            left: 0; right: 0;
            height: 1px;
            pointer-events: none;
            z-index: 2;
        }

        .cutline-playoff {
            top: calc(8px + 6 * var(--row-height));
            background: rgba(255,255,255,0.08);
        }

        .cutline-playin {
            top: calc(8px + 10 * var(--row-height));
            background: rgba(255,255,255,0.08);
        }

        .standings-rows {
            position: relative;
            height: calc(15 * var(--row-height));
        }

        /* ── Team Row ── */
        .team-row {
            position: absolute;
            width: 100%;
            height: var(--row-height);
            display: flex;
            align-items: center;
            padding: 0 20px 0 24px;
            transition: top 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            cursor: default;
        }

        .team-row::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20px; right: 20px;
            height: 1px;
            background: var(--border-subtle);
        }

        .team-row:hover {
            background: var(--bg-card-hover);
        }

        /* Zone indicator — colored bar on the left edge */
        .zone-indicator {
            position: absolute;
            left: 0;
            top: 8px;
            bottom: 8px;
            width: 3px;
            border-radius: 0 2px 2px 0;
            transition: background 0.3s;
        }

        .zone-indicator.zone-playoff { background: var(--playoff-green); }
        .zone-indicator.zone-playin { background: var(--playin-amber); }
        .zone-indicator.zone-lottery { background: transparent; }

        .rank {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 20px;
            width: 32px;
            text-align: center;
            flex-shrink: 0;
            transition: color 0.3s;
        }

        .rank.top-3 { color: var(--playoff-green); }
        .rank.playoff { color: var(--playoff-green); }
        .rank.playin { color: var(--playin-amber); }
        .rank.lottery { color: var(--text-muted); }

        .team-logo {
            width: 32px; height: 32px;
            object-fit: contain;
            flex-shrink: 0;
            margin: 0 14px 0 10px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            transition: transform 0.2s;
        }

        .team-row:hover .team-logo {
            transform: scale(1.1);
        }

        .team-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            white-space: nowrap;
            min-width: 200px;
        }

        .team-abbr {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-left: 8px;
            flex-shrink: 0;
        }

        /* ── Bump Chart ── */
        .bump-chart {
            display: none;
            padding: 20px 0 20px 0;
            position: relative;
        }

        .bump-chart.active {
            display: block;
        }

        .bump-chart-svg {
            width: 100%;
            height: 680px;
            overflow: visible;
        }

        .bump-line {
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: opacity 0.2s, stroke-width 0.2s;
            cursor: pointer;
        }

        .bump-chart-svg.has-hover .bump-line {
            opacity: 0.12;
        }

        .bump-chart-svg.has-hover .bump-line.highlighted {
            opacity: 1;
            stroke-width: 4;
        }

        .bump-label {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            fill: var(--text-secondary);
            transition: opacity 0.2s, fill 0.2s;
            cursor: pointer;
        }

        .bump-chart-svg.has-hover .bump-label {
            opacity: 0.2;
        }

        .bump-chart-svg.has-hover .bump-label.highlighted {
            opacity: 1;
            fill: var(--text-primary);
        }

        .bump-cutline-playoff {
            stroke: var(--playoff-green);
            stroke-width: 1.5;
            stroke-dasharray: 6 4;
            opacity: 0.4;
        }

        .bump-cutline-playin {
            stroke: var(--playin-amber);
            stroke-width: 1.5;
            stroke-dasharray: 6 4;
            opacity: 0.4;
        }

        .bump-cutline-label-playoff {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            fill: var(--playoff-green);
            opacity: 0.7;
        }

        .bump-cutline-label-playin {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            fill: var(--playin-amber);
            opacity: 0.7;
        }

        .bump-rank-label {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 12px;
            fill: var(--text-muted);
            opacity: 0.3;
        }

        .bump-logo {
            width: 22px;
            height: 22px;
            border-radius: 50%;
        }

        /* ── Timeline ── */
        .timeline {
            padding: 0 4px;
            margin-bottom: 20px;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .timeline-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .date-slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.06);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        .date-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--accent-gold);
            cursor: pointer;
            box-shadow: 0 0 0 4px rgba(212,168,67,0.15), 0 2px 8px rgba(0,0,0,0.3);
            transition: box-shadow 0.2s, transform 0.2s;
        }

        .date-slider::-webkit-slider-thumb:hover {
            box-shadow: 0 0 0 6px rgba(212,168,67,0.2), 0 4px 16px rgba(0,0,0,0.4);
            transform: scale(1.1);
        }

        .date-slider::-moz-range-thumb {
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--accent-gold);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 0 4px rgba(212,168,67,0.15), 0 2px 8px rgba(0,0,0,0.3);
        }

        /* ── Footer ── */
        .footer {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .page-wrapper { padding: 16px 12px 32px; }
            .header-top { flex-wrap: wrap; gap: 4px; }
            .controls { gap: 8px; }
            .conf-tab { padding: 8px 14px; font-size: 12px; }
            .team-name { min-width: 140px; font-size: 13px; }
            .team-abbr { display: none; }
            .board-legend { display: none; }
            .board-header { padding: 12px 16px 10px; }
            .team-row { padding: 0 12px 0 16px; }
        }

        /* ── Load animation ── */
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header { animation: fade-up 0.6s ease-out; }
        .timeline { animation: fade-up 0.6s ease-out 0.1s both; }
        .board { animation: fade-up 0.6s ease-out 0.2s both; }
    </style>
</head>

    <div class="page-wrapper">
        <header class="header">
            <div class="header-top">
                <div class="title-group">
                    <div class="title">NBA Standings Race</div>

                </div>
                <div class="date-display" id="dateDisplay">Oct 22, 2025</div>
            </div>
            <div class="controls">

                    <button class="conf-tab" data-conference="west">West</button>
                </div>

                <div class="divider"></div>

                <div class="playback">
                    <button class="ctrl-btn" id="backBtn" title="Previous">◀◀</button>
                    <button class="ctrl-btn play-btn" id="playBtn" title="Play">▶</button>
                    <button class="ctrl-btn" id="forwardBtn" title="Next">▶▶</button>
                </div>

                <div class="divider"></div>

                <div class="speed-group">
                    <span class="speed-label">Speed</span>
                    <input type="range" id="speedSlider" class="speed-slider" min="0.25" max="3" step="0.25" value="1">
                </div>

                <div class="divider"></div>

                <div class="view-toggle">
                    <button class="view-btn active" data-view="list">List</button>
                    <button class="view-btn" data-view="chart">Chart</button>
                </div>
            </div>
        </header>

        <div class="timeline">
            <div class="timeline-header">
                <span class="timeline-label">Timeline</span>
                <span class="timeline-label" id="timelineProgress">Day 1</span>
            </div>
            <input type="range" id="dateSlider" class="date-slider" min="0" max="100" value="0">
        </div>

        <div class="board">
            <div class="board-header">
                <div class="board-title" id="boardTitle">Eastern Conference</div>
                <div class="board-legend">
                    <div class="legend-item"><div class="legend-dot playoffs"></div>Playoffs</div>
                    <div class="legend-item"><div class="legend-dot playin"></div>Play-In</div>

            <div class="standings-area active" id="standingsArea">

                <div class="standings-rows" id="standingsRows"></div>
            </div>
            <div class="bump-chart" id="bumpChart">
                <svg class="bump-chart-svg" id="bumpSvg"></svg>
            </div>
        </div>

        <div class="footer">Data sourced from NBA.com &middot; Visualization by Claude</div>
    </div>

            const slug = logoMap[teamAbbr];
            return `https://a.espncdn.com/i/teamlogos/nba/500/${slug}.png`;
        }

        let teamElements = {};
        let lastConference = null;

        function initTeamElements(conference) {
            standingsRows.innerHTML = "";
            teamElements = {};
            const teams = conference === "east"
                ? ["ATL","BOS","BRK","CHI","CHO","CLE","DET","IND","MIA","MIL","NYK","ORL","PHI","TOR","WAS"]
                : ["DAL","DEN","GSW","HOU","LAC","LAL","MEM","MIN","NOP","OKC","PHO","POR","SAC","SAS","UTA"];

            boardTitle.textContent = conference === "east" ? "Eastern Conference" : "Western Conference";

            teams.forEach(abbr => {
                const row = document.createElement("div");
                row.className = "team-row";
                row.style.top = "0px";

                const zoneInd = document.createElement("div");
                zoneInd.className = "zone-indicator";

                const rank = document.createElement("div");
                rank.className = "rank";
                rank.textContent = "1";

                const logo = document.createElement("img");
                logo.className = "team-logo";
                logo.src = getLogoUrl(abbr);
                logo.alt = abbr;
                logo.loading = "lazy";
                logo.onerror = function() { this.style.display = "none"; };

                const nameEl = document.createElement("div");
                nameEl.className = "team-name";
                nameEl.textContent = teamNames[abbr];

                const abbrEl = document.createElement("div");
                abbrEl.className = "team-abbr";
                abbrEl.textContent = abbr;

                row.appendChild(zoneInd);
                row.appendChild(rank);
                row.appendChild(logo);
                row.appendChild(nameEl);
                row.appendChild(abbrEl);

                standingsRows.appendChild(row);
                teamElements[abbr] = { row, rank, zoneInd };
            });

            lastConference = conference;
        }

        function renderStandings() {
            if (lastConference !== currentConference) {
                initTeamElements(currentConference);
            }

            const currentData = data[currentConference];
            const currentDate = allDates[currentDateIndex];

            // Find this date's data, or the most recent prior date with data
            let dateData = currentData.find(row => row[0] === currentDate);
            if (!dateData) {
                for (let i = currentDateIndex - 1; i >= 0; i--) {
                    dateData = currentData.find(row => row[0] === allDates[i]);
                    if (dateData) break;
                }
            }

            dateDisplay.textContent = currentDate;
            dateSlider.value = currentDateIndex;
            timelineProgress.textContent = `Day ${currentDateIndex + 1} of ${allDates.length}`;

            Object.values(teamElements).forEach(el => {
                el.row.style.display = "none";
            });

            if (!dateData) return;

            for (let i = 1; i < dateData.length; i++) {
                const teamAbbr = dateData[i];
                if (!teamAbbr || !teamElements[teamAbbr]) continue;

                const el = teamElements[teamAbbr];
                const rankNum = i;
                el.row.style.display = "flex";
                el.row.style.top = (rankNum - 1) * 52 + "px";
                el.rank.textContent = rankNum;

                // Rank coloring
                el.rank.className = "rank";
                if (rankNum <= 3) el.rank.classList.add("top-3");
                else if (rankNum <= 6) el.rank.classList.add("playoff");
                else if (rankNum <= 10) el.rank.classList.add("playin");
                else el.rank.classList.add("lottery");

                // Zone indicator
                el.zoneInd.className = "zone-indicator";
                if (rankNum <= 6) el.zoneInd.classList.add("zone-playoff");
                else if (rankNum <= 10) el.zoneInd.classList.add("zone-playin");
                else el.zoneInd.classList.add("zone-lottery");
            }
        }

        function updateDate(index) {
            currentDateIndex = Math.max(0, Math.min(index, allDates.length - 1));
            dateSlider.value = currentDateIndex;
            renderStandings();
        }

        function getInterval() {
            return Math.max(60, 600 / animationSpeed);
        }

        function play() {
            if (isPlaying) return;
            isPlaying = true;
            playBtn.textContent = "⏸";

            function step() {
                currentDateIndex++;
                if (currentDateIndex >= allDates.length - 1) {
                    currentDateIndex = allDates.length - 1;
                    updateDate(currentDateIndex);
                    pause();
                    return;
                }
                updateDate(currentDateIndex);
                animationTimerId = setTimeout(step, getInterval());
            }
            animationTimerId = setTimeout(step, getInterval());
        }

        function pause() {
            isPlaying = false;
            playBtn.textContent = "▶";
            if (animationTimerId) { clearTimeout(animationTimerId); animationTimerId = null; }
        }

        playBtn.addEventListener("click", () => isPlaying ? pause() : play());

        backBtn.addEventListener("click", () => {
            pause();
            updateDate(currentDateIndex - 1);
        });

        forwardBtn.addEventListener("click", () => {
            pause();
            updateDate(currentDateIndex + 1);
        });

        speedSlider.addEventListener("input", (e) => {
            animationSpeed = parseFloat(e.target.value);
            if (isPlaying) { pause(); play(); }
        });

        dateSlider.addEventListener("input", (e) => {
            pause();
            updateDate(parseInt(e.target.value));
        });

        // ── View Toggle ──
        let currentView = "list";
        const viewButtons = document.querySelectorAll(".view-btn");
        const standingsArea = document.getElementById("standingsArea");
        const bumpChartEl = document.getElementById("bumpChart");
        const bumpSvg = document.getElementById("bumpSvg");
        let bumpChartBuiltFor = null;

        viewButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                viewButtons.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentView = btn.dataset.view;
                if (currentView === "list") {
                    standingsArea.classList.add("active");
                    bumpChartEl.classList.remove("active");
                } else {
                    standingsArea.classList.remove("active");
                    bumpChartEl.classList.add("active");
                    renderBumpChart();
                }
            });
        });

        // ── Bump Chart ──
        const BUMP_PADDING = { top: 20, right: 100, bottom: 20, left: 100 };
        const BUMP_HEIGHT = 680;

        function buildBumpData(conference) {
            const confData = data[conference];
            const teams = conference === "east"
                ? ["ATL","BOS","BRK","CHI","CHO","CLE","DET","IND","MIA","MIL","NYK","ORL","PHI","TOR","WAS"]
                : ["DAL","DEN","GSW","HOU","LAC","LAL","MEM","MIN","NOP","OKC","PHO","POR","SAC","SAS","UTA"];

            const teamRanks = {};
            teams.forEach(t => { teamRanks[t] = []; });

            allDates.forEach((date, di) => {
                const dayData = confData.find(r => r[0] === date);
                if (!dayData) return;
                for (let rank = 1; rank < dayData.length; rank++) {
                    const abbr = dayData[rank];
                    if (abbr && teamRanks[abbr]) {
                        teamRanks[abbr].push({ dateIndex: di, rank });
                    }
                }
            });

            return teamRanks;
        }

        function renderBumpChart() {
            const svgWidth = bumpSvg.parentElement.clientWidth;
            const chartWidth = svgWidth - BUMP_PADDING.left - BUMP_PADDING.right;
            const chartHeight = BUMP_HEIGHT - BUMP_PADDING.top - BUMP_PADDING.bottom;

            bumpSvg.setAttribute("viewBox", `0 0 ${svgWidth} ${BUMP_HEIGHT}`);
            bumpSvg.innerHTML = "";
            bumpSvg.classList.remove("has-hover");

            const teamRanks = buildBumpData(currentConference);
            const startIdx = currentDateIndex;
            const endIdx = allDates.length - 1;
            const dateSpan = Math.max(1, endIdx - startIdx);

            function x(dateIndex) {
                return BUMP_PADDING.left + ((dateIndex - startIdx) / dateSpan) * chartWidth;
            }

            function y(rank) {
                return BUMP_PADDING.top + ((rank - 1) / 14) * chartHeight;
            }

            // Rank labels on left
            for (let r = 1; r <= 15; r++) {
                const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
                label.setAttribute("x", BUMP_PADDING.left - 12);
                label.setAttribute("y", y(r) + 4);
                label.setAttribute("text-anchor", "end");
                label.classList.add("bump-rank-label");
                label.textContent = r;
                bumpSvg.appendChild(label);
            }

            // Cutlines
            [6, 10].forEach((rank, i) => {
                const lineY = y(rank) + (y(rank + 1) - y(rank)) / 2;
                const isPlayoff = i === 0;
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", BUMP_PADDING.left);
                line.setAttribute("x2", svgWidth - BUMP_PADDING.right);
                line.setAttribute("y1", lineY);
                line.setAttribute("y2", lineY);
                line.classList.add(isPlayoff ? "bump-cutline-playoff" : "bump-cutline-playin");
                bumpSvg.appendChild(line);

                const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
                label.setAttribute("x", svgWidth - BUMP_PADDING.right + 4);
                label.setAttribute("y", lineY + 4);
                label.classList.add(isPlayoff ? "bump-cutline-label-playoff" : "bump-cutline-label-playin");
                label.textContent = isPlayoff ? "PLAYOFFS" : "PLAY-IN";
                bumpSvg.appendChild(label);
            });

            // Team paths
            const pathElements = {};
            const labelElements = {};

            Object.keys(teamRanks).forEach(abbr => {
                const points = teamRanks[abbr].filter(p => p.dateIndex >= startIdx);
                if (points.length === 0) return;

                // Build path
                const d = points.map((p, i) => {
                    const px = x(p.dateIndex);
                    const py = y(p.rank);
                    if (i === 0) return `M ${px} ${py}`;

                    // Smooth curve between points
                    const prev = points[i - 1];
                    const prevX = x(prev.dateIndex);
                    const prevY = y(prev.rank);
                    const cpX = (prevX + px) / 2;
                    return `C ${cpX} ${prevY} ${cpX} ${py} ${px} ${py}`;
                }).join(" ");

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", d);
                path.style.stroke = teamColors[abbr];
                path.classList.add("bump-line");
                path.dataset.team = abbr;
                bumpSvg.appendChild(path);
                pathElements[abbr] = path;

                // Start label (logo + abbr)
                const first = points[0];
                const logoSize = 18;

                const startLogo = document.createElementNS("http://www.w3.org/2000/svg", "image");
                startLogo.setAttribute("href", getLogoUrl(abbr));
                startLogo.setAttribute("x", x(first.dateIndex) - 28 - logoSize);
                startLogo.setAttribute("y", y(first.rank) - logoSize / 2);
                startLogo.setAttribute("width", logoSize);
                startLogo.setAttribute("height", logoSize);
                startLogo.classList.add("bump-label");
                startLogo.dataset.team = abbr;
                bumpSvg.appendChild(startLogo);

                const startLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
                startLabel.setAttribute("x", x(first.dateIndex) - 8);
                startLabel.setAttribute("y", y(first.rank) + 4);
                startLabel.setAttribute("text-anchor", "end");
                startLabel.classList.add("bump-label");
                startLabel.dataset.team = abbr;
                startLabel.textContent = abbr;
                bumpSvg.appendChild(startLabel);

                // End label (abbr + logo)
                const last = points[points.length - 1];
                const endLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
                endLabel.setAttribute("x", x(last.dateIndex) + 8);
                endLabel.setAttribute("y", y(last.rank) + 4);
                endLabel.setAttribute("text-anchor", "start");
                endLabel.classList.add("bump-label");
                endLabel.dataset.team = abbr;
                endLabel.textContent = abbr;
                bumpSvg.appendChild(endLabel);

                const endLogo = document.createElementNS("http://www.w3.org/2000/svg", "image");
                endLogo.setAttribute("href", getLogoUrl(abbr));
                endLogo.setAttribute("x", x(last.dateIndex) + 46);
                endLogo.setAttribute("y", y(last.rank) - logoSize / 2);
                endLogo.setAttribute("width", logoSize);
                endLogo.setAttribute("height", logoSize);
                endLogo.classList.add("bump-label");
                endLogo.dataset.team = abbr;
                bumpSvg.appendChild(endLogo);

                labelElements[abbr] = [startLabel, endLabel, startLogo, endLogo];
            });

            bumpChartBuiltFor = currentConference + ":" + currentDateIndex;

            // Hover interactions
            function highlightTeam(abbr) {
                bumpSvg.classList.add("has-hover");
                Object.keys(pathElements).forEach(t => {
                    pathElements[t].classList.toggle("highlighted", t === abbr);
                });
                Object.keys(labelElements).forEach(t => {
                    labelElements[t].forEach(l => l.classList.toggle("highlighted", t === abbr));
                });
            }

            function clearHighlight() {
                bumpSvg.classList.remove("has-hover");
                Object.values(pathElements).forEach(p => p.classList.remove("highlighted"));
                Object.values(labelElements).forEach(arr => arr.forEach(l => l.classList.remove("highlighted")));
            }

            bumpSvg.addEventListener("mouseover", (e) => {
                const team = e.target.dataset?.team;
                if (team) highlightTeam(team);
            });

            bumpSvg.addEventListener("mouseout", (e) => {
                const team = e.target.dataset?.team;
                if (team) clearHighlight();
            });

        }

        // Patch renderStandings to also update bump chart
        const _origRenderStandings = renderStandings;
        renderStandings = function() {
            _origRenderStandings();
            if (currentView === "chart") {
                const key = currentConference + ":" + currentDateIndex;
                if (bumpChartBuiltFor !== key) {
                    renderBumpChart();
                }
            }
        };

        // Update conference switch to rebuild bump chart
        tabButtons.forEach(btn => {
            // Re-add listener (overrides previous)
            btn.onclick = () => {
                tabButtons.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentConference = btn.dataset.conference;
                bumpChartBuiltFor = null;
                renderStandings();
            };
        });

        // Keyboard shortcuts
        document.addEventListener("keydown", (e) => {
            if (e.key === " " || e.code === "Space") { e.preventDefault(); isPlaying ? pause() : play(); }
            if (e.key === "ArrowLeft") { pause(); updateDate(currentDateIndex - 1); }
            if (e.key === "ArrowRight") { pause(); updateDate(currentDateIndex + 1); }
        });

        // Start on day 1
        renderStandings();
    </script>
<script data-goatcounter="https://nba-standings.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
